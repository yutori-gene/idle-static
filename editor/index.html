<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<title>Idle RPG - Editor</title>
		<link rel="icon" type="image/png" href="/idle-static/assets/favicon-o_1s3AkD.png" />
		<!-- <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script> -->
		<script type="module" crossorigin src="/idle-static/assets/editor-DxxoUqEE.js"></script>
		<link rel="modulepreload" crossorigin href="/idle-static/assets/control-lV5wJ_EL.js">
		<link rel="modulepreload" crossorigin href="/idle-static/assets/client-CvQ7RCod.js">
		<link rel="stylesheet" crossorigin href="/idle-static/assets/editor-gvtcCZLS.css">
	</head>
	<body style="background-color: #bce8f5; margin: 0; overflow: hidden;">
		<!-- 言語選択画面用（フルスクリーン） -->
		<div id="language-selector-container" style="display: none;"></div>

		<!-- Split.js分割コンテナ -->
		<div id="split-container" style="display: flex; height: 100vh; width: 100%;">
			<!-- 左パネル: エディター -->
			<div id="editor-panel" style="overflow: auto;">
				<div class="container-fluid px-2">
					<div class="form-group"></div>
					<form action="/docs/form-submission.html" method="get">
						<div id="editor-container"></div>
					</form>
				</div>
			</div>
			<!-- 右パネル: ドキュメント -->
			<div id="document-panel" style="display: flex; flex-direction: column; background: #f5f5f5;">
				<div id="document-header" style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #e0e0e0; border-bottom: 1px solid #ccc;">
					<span style="font-weight: bold; font-size: 14px;">📄 ドキュメント</span>
					<button id="close-document-btn" style="border: none; background: transparent; cursor: pointer; font-size: 18px; padding: 0 4px;">×</button>
				</div>
				<iframe id="document-iframe" style="flex: 1; border: none; width: 100%;"></iframe>
			</div>
		</div>

		<style>
			/* Split.js ガッタースタイル */
			.gutter {
				background-color: #ccc;
				background-repeat: no-repeat;
				background-position: 50%;
			}
			.gutter.gutter-horizontal {
				cursor: col-resize;
				background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAeCAYAAADkftS9AAAAIklEQVQoU2M4c+bMfwY8QFJSEp81AwMjjgETPT09/QcAAA==');
			}
			.gutter:hover {
				background-color: #aaa;
			}

			/* 上部の余白を削除して固定バーを回避 */
			
			body {
				margin-top: 0 !important;
				padding-top: 0 !important;
			}
			
			/* 
			#split-container {
				margin: 0 !important;
				padding: 0 !important;
			} 
			
			#editor-panel {
				padding: 0 !important;
				margin: 0 !important;
			} 
			
			.container-fluid {
				padding: 0 !important;
				margin: 0 !important;
			} 
			*/
		</style>
		<!-- <script src="./bundle.js"></script> -->
		<script src="./jquery.min.3.7.1.js"></script>
	</body>
</html>
